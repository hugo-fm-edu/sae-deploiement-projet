services:
  # service PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: unless-stopped
    environment: #var d'env pour configurer la bdd
      POSTGRES_USER: ${POSTGRES_USER:-sae_samy_hugo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sae_samy_hugo}
      POSTGRES_DB: ${POSTGRES_DB:-sae_ddaw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/database:/app/database # pour pouvoir initialiser PostgresSQL
    ports:
      - "5432:5432" 
    networks:
      - backend
    healthcheck: #s'assurer que la db est prete avant de demarrer l'api
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sae_samy_hugo} -d ${POSTGRES_DB:-sae_ddaw}"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  # service API FastAPI
  api:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sae_samy_hugo:sae_samy_hugo@db:5432/sae_ddaw
    ports:
      - "8000:8000"
    networks:
      - backend
    command: >
      sh -c "
      echo 'En attente de la BDD ....' &&
      sleep 1 &&
      echo 'Migrations Alembic ....' &&
      alembic upgrade head &&
      echo 'Démarrage de l API ....' &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
  
volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
